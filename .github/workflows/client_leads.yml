name: Hourly Client Leads Email

on:
  schedule:
    - cron: "0 * * * *"  # every hour
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  leads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Send client leads email
        working-directory: scripts
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LEAD_KEYWORDS: "frontend,javascript,html,css,react,c#,.net,asp.net,sql server,mssql"
        run: python client_leads.py

      - name: Save seen-leads state
        run: |
          git config user.name "linkedin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen_leads.txt
          git diff --cached --quiet || git commit -m "chore: record sent leads"
          git pull --rebase origin main
          git push
