name: Post to LinkedIn

on:
  schedule:
    - cron: "0 4 * * *"   # 09:00 PKT
    - cron: "0 13 * * *"  # 18:00 PKT
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Post next item from content pool
        working-directory: scripts
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: python post_to_linkedin.py

      - name: Save rotation state
        run: |
          git config user.name "linkedin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/post_index.txt
          git diff --cached --quiet || git commit -m "chore: advance post index"
          git push
