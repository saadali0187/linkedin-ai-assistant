name: Post to LinkedIn

on:
  schedule:
    - cron: "0 4 * * *"   # 09:00 PKT
    - cron: "0 13 * * *"  # 18:00 PKT
  workflow_dispatch:
    inputs:
      with_image:
        description: "Attach a generated image?"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Post next item from content pool
        working-directory: scripts
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          WITH_IMAGE: ${{ github.event_name != 'workflow_dispatch' && 'true' || github.event.inputs.with_image }}
        run: python post_to_linkedin.py

      - name: Save rotation state
        run: |
          git config user.name "linkedin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/post_index.txt
          git diff --cached --quiet || git commit -m "chore: advance post index"
          git push
